services:
  fiuba-db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: fiuba_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"  
    volumes:
      - fiuba_pgdata:/var/lib/postgresql/data
      - ./create-fiuba-schema.sql:/docker-entrypoint-initdb.d/create-fiuba-schema.sql:ro

volumes:
  fiuba_pgdata:
